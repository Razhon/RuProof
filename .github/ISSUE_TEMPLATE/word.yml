name: Предложить слова
description: Правильные общеупотребительные слова, которые LanguageTool считает ошибкой
title: "Слова: "
labels: ["слово"]
body:
  - type: textarea
    id: words
    attributes:
      label: Слова
      description: |
        По одному слову на строке, в начальной форме (именительный падеж, инфинитив).
        Пример фразы и формы (как слово склоняется или спрягается) можно дописать через « — », но это необязательно.
      placeholder: |
        брумзик
        брумзить
        шлёпик — Шлёпик снова мурлычет. — нет кого? шлёпика
    validations:
      required: true
