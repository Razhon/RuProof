<svg xmlns="http://www.w3.org/2000/svg" width="880" height="842" viewBox="0 0 880 842">
<title>Речь персонажей: обычный LanguageTool, РуПруф neutral и prose</title>
<style>
.w{box-sizing:border-box;width:880px;background:#18181a;border-radius:12px;padding:14px 16px 18px;font:13px/18px system-ui,-apple-system,"Segoe UI",sans-serif;color:#c9c9cc}
.hd,.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
.hd{color:#9a9aa2;font-size:13px;line-height:17px;font-weight:600}
.hd i{font-style:normal;color:#e8e8ea}
.cap{color:#8a8a92;font-size:12px;line-height:17px;margin:16px 0 6px;border-top:1px solid #2a2a2e;padding-top:10px}
.f{position:relative;background:#232326;border:1px solid #3a3a3e;border-radius:6px;padding:8px 34px 8px 12px;font:16px/1.5 Georgia,"Times New Roman",serif;color:#eee}
.b{position:absolute;right:8px;bottom:9px;width:16px;height:16px;border-radius:50%;font:700 10px/16px system-ui,sans-serif;text-align:center;color:#fff;background:#d4183d}
.b.ok{background:#1a73e8}
u{text-decoration:none;position:relative}u::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--u)}
.sp{--u:#e5484d}.gr{--u:#f5a524}.st{--u:#8b7cf6}
.a{border-radius:2px}.sp.a{background:#e5484d38}.gr.a{background:#f5a52438}.st.a{background:#8b7cf638}
.p{margin:6px 0 0;background:#111214;border:1px solid #3a3a3e;border-radius:8px;padding:7px 10px 8px;color:#e4e4e6}
.p b{display:block;font-size:11px;line-height:15px;margin-bottom:2px}
.c{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.c span{background:#1e8fff;color:#07172a;border-radius:4px;padding:2px 8px;font-weight:600;font-size:12px;line-height:17px}
</style>
<foreignObject width="880" height="842"><div xmlns="http://www.w3.org/1999/xhtml" class="w">
<div class="hd"><span>Обычный LanguageTool</span><i>РуПруф, neutral</i><i>РуПруф, prose</i></div>

<div class="cap">Разговорные слова</div>
<div class="row">
 <div><div class="f">— <u class="sp">Оу</u>, <u class="sp">чесслово</u>, я не хотел. <u class="sp a">Кхм</u>.<span class="b">3</span></div>
  <div class="p"><b>Орфографическая</b><div class="c"><span>Хм</span><span>Ким</span><span>КОм</span></div></div></div>
 <div><div class="f">— <u class="st">Оу</u>, <u class="st a">чесслово</u>, я не хотел. <u class="st">Кхм</u>.<span class="b">3</span></div>
  <div class="p"><b>Слово вне нормы</b>Разговорное слово: в нейтральном тексте лучше «честное слово».<div class="c"><span>честное слово</span></div></div></div>
 <div><div class="f">— Оу, чесслово, я не хотел. Кхм.<span class="b ok">✓</span></div></div>
</div>

<div class="cap">Заикание и растяжка</div>
<div class="row">
 <div><div class="f">— <u class="sp a">П-прямо</u> сейчас? <u class="sp">Не-е-ет</u>!<span class="b">2</span></div>
  <div class="p"><b>Орфографическая</b><div class="c"><span>Пережить</span><span>Перебить</span><span>Дефицит</span></div></div></div>
 <div><div class="f">— <u class="sp a">П-прямо</u> сейчас? <u class="sp">Не-е-ет</u>!<span class="b">2</span></div>
  <div class="p"><b>Орфографическая</b>Заикание или растяжка?<div class="c"><span>Пережить</span><span>Перебить</span></div></div></div>
 <div><div class="f">— П-прямо сейчас? Не-е-ет!<span class="b ok">✓</span></div></div>
</div>

<div class="cap">Запинка</div>
<div class="row">
 <div><div class="f">— <u class="gr a">Ва</u>… <u class="gr">ва</u>… ваше благородие.<span class="b">2</span></div>
  <div class="p"><b>Логическая ошибка</b>Имелось в виду «В·А»?<div class="c"><span>В·А</span></div></div></div>
 <div><div class="f">— <u class="st a">Ва</u>… <u class="st">ва</u>… ваше благородие.<span class="b">2</span></div>
  <div class="p"><b>Логическая ошибка</b>Запинка? Имелось в виду «В·А»?<div class="c"><span>В·А</span></div></div></div>
 <div><div class="f">— Ва… ва… ваше благородие.<span class="b ok">✓</span></div></div>
</div>

<div class="cap">Разбитое слово</div>
<div class="row">
 <div><div class="f">— Это <u class="sp a">чел-овек</u> такой, — сказал он.<span class="b">1</span></div>
  <div class="p"><b>Орфографическая</b><div class="c"><span>человек</span></div></div></div>
 <div><div class="f">— Это <u class="sp a">чел-овек</u> такой, — сказал он.<span class="b">1</span></div>
  <div class="p"><b>Орфографическая</b>Разбиение слова: художественный приём?<div class="c"><span>человек</span></div></div></div>
 <div><div class="f">— Это чел-овек такой, — сказал он.<span class="b ok">✓</span></div></div>
</div>
</div></foreignObject>
</svg>
