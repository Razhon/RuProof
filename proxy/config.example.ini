; Настройки прокси. Скопируйте в proxy/config.ini (не попадает в git)
; и правьте: прокси перечитывает файл при изменении, перезапуск не нужен.
; Нет файла или в нём ошибка -> режим neutral (строка об этом есть в podman/docker logs ruproof-proxy-1).

[proxy]
; neutral — любой текст: документы, статьи, письма (по умолчанию)
; prose   — художественный текст: речь персонажей, имена, заикания, растяжки
mode = neutral

[rules]
; Отдельные правила поверх режима: yes — включить, no — выключить. Без строки действует режим.
; В neutral включены первые восемь, в prose — все.
;
; compound     = yes  ; составное слово из словарных частей не ошибка (бизнес-аналитик)
; split        = yes  ; разбиение словарного слова (чел-овек, Безоб Разие): подсказка, в речи не помечается
; cut          = yes  ; слово, оборванное перед «…» (подум…): подсказка, в речи не помечается
; stretch_hint = yes  ; Нееет: первым вариантом Не-е-ет
; variant      = yes  ; слово с заглавной: первым вариантом более частое близкое написание из текста
; concessive   = yes  ; «Что бы она ни хотела» не ошибка
; guillemets   = yes  ; непарные «»
; nested       = yes  ; «» внутри «» -> „“
; stretch      = no   ; заикание и растяжка через дефис (П-прямо, Не-е-ет) не замечание;
;                     ; без ключа — подсказка стиля, первым вариантом словарная форма (Нет)
; stammer      = no   ; запинка с многоточием (Ва… ва… ваше) не замечание; без ключа — подсказка стиля
; titles       = no   ; незнакомые слова в названии «» — подсказка
; names        = no   ; повторяющееся незнакомое слово с заглавной — подсказка «похоже на имя», память имён
; nonstandard  = no   ; слово вне нормы (rpdict -u: оу, чесслово, чувак) и просторечие LT (чё, щас) не замечание
;                     ; стиля; без ключа просторечие LT — замечание стиля, а не опечатка
; caps         = no   ; слово ЗАГЛАВНЫМИ не замечание; без ключа — замечание стиля
; fillers      = no   ; слова-паразиты (как бы, так сказать) не замечание; без ключа замечание остаётся как у LT
; dialogue     = no  ; реплики после тире — речь: разбиения и обрывы в ней прощаются, замечания на стыке речи
;                     ; и авторского текста перепроверяются по частям
